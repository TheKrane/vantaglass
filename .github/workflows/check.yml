name: Check and release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact revision
        env:
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "$REVISION"
          git checkout --detach FETCH_HEAD
      - name: Check installer and management tests
        run: |
          bash -n install.sh bootstrap.sh hooks/vantaglass hooks/vantaglass-update
          python3 -m compileall -q tools tests
          python3 -m unittest discover -s tests -v
      - name: Build verified source archive
        run: python3 tools/package.py
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --repo "$GITHUB_REPOSITORY" --title "Vantaglass v$(cat VERSION)" --notes-file RELEASE_NOTES.md --verify-tag --latest
